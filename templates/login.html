<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusCare Connect</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>CampusCare Connect</h1>
        <p>Norfolk State University</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/resources">Wellness Resources</a>
        <a href="/self-care">Self-Care</a>
        <a href="/login">Student Login</a>
    </nav>

    <section class="welcome">

        <h2>Student Login</h2>

        <p>Welcome back, Spartan!</p>
        <p>Sign in to access your CampusCare Connect account.</p>

        <form>

            <label for="email">NSU Email Address</label>
            <br><br>

            <input type="email" id="email"
                   placeholder="Enter your NSU email">
            <br><br>

            <label for="password">Password</label>
            <br><br>

            <input type="password" id="password"
                   placeholder="Enter your password">
            <br><br>

            <button type="submit">Sign In</button>

        </form>

        <p>New to CampusCare Connect?</p>
        <a href="/register">Create an Account</a>

    </section>

</body>
</html>
