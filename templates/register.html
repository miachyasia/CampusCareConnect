<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CampusCare Connect</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>CampusCare Connect</h1>
        <p>Norfolk State University</p>
    </header>

    <nav>
        <a href="/">Home</a>
        <a href="/resources">Wellness Resources</a>
        <a href="/self-care">Self-Care</a>
        <a href="/login">Student Login</a>
    </nav>

    <section class="welcome">

        <h2>Create Your Account</h2>

        <p>Join CampusCare Connect and explore student wellness resources.</p>

        <form method="POST" action="/register">

            <label for="name">Full Name</label>
            <br><br>
            <input type="text" id="name" name="full_name"
                    placeholder="Enter your full name" required>
            <br><br>

            <label for="email">NSU Email Address</label>
            <br><br>
            <input type="email" id="email" name="email"
                    placeholder="Enter your NSU email" required>
            <br><br>

            <label for="password">Create Password</label>
            <br><br>
            <input type="password" id="password" name="password"
                    placeholder="Create a password" required>
            <br><br>

            <label for="confirm-password">Confirm Password</label>
            <br><br>
            <input type="password" id="confirm-password"
                    name="confirm_password"
                    placeholder="Confirm your password" required>
            <br><br>

            <button type="submit">Create Account</button>

        </form>

        <p>Already have an account?</p>
        <a href="/login">Sign In</a>

    </section>

</body>
</html>
